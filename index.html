<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column ledger. Header -> KPI strip -> equity chart -> tabbed detail (latest run, positions, trades, history, rules). */
:root {
  --bg: #f4f6f4;
  --surface: #ffffff;
  --sunk: #e9eeeb;
  --line: #d5ddd8;
  --fg: #17211d;
  --muted: #5d6b65;
  --accent: #1d5d7c;
  --accent-soft: #dbe9f0;
  --bench: #b0812a;
  --up: #1c7a4b;
  --up-soft: #dcefe4;
  --down: #b23a3a;
  --down-soft: #f6e0de;
  --warn: #9a6a12;
  --warn-soft: #f5ead2;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #171e1b; --sunk: #1e2723; --line: #2b3632; --fg: #e3eae6; --muted: #93a39c;
    --accent: #72b6d6; --accent-soft: #1b3240; --bench: #d8a64a;
    --up: #5cc48d; --up-soft: #173527; --down: #ef7b74; --down-soft: #3a1d1c; --warn: #e0b35a; --warn-soft: #3a2f18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #171e1b; --sunk: #1e2723; --line: #2b3632; --fg: #e3eae6; --muted: #93a39c;
  --accent: #72b6d6; --accent-soft: #1b3240; --bench: #d8a64a;
  --up: #5cc48d; --up-soft: #173527; --down: #ef7b74; --down-soft: #3a1d1c; --warn: #e0b35a; --warn-soft: #3a2f18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 64px; display: grid; gap: 22px; }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.up { color: var(--up); } .down { color: var(--down); }

header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
header.top h1 { margin: 0; font: 700 clamp(28px, 5vw, 40px)/1 var(--f-display); letter-spacing: -0.02em; }
header.top .sub { color: var(--muted); font-size: 13px; margin-top: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 500 12px/1.6 var(--f-body); letter-spacing: .02em; background: var(--sunk); color: var(--fg); white-space: nowrap; }
.chip.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
.chip.on { background: var(--up-soft); color: var(--up); }
.chip.off { background: var(--down-soft); color: var(--down); }
.chip.neu { background: var(--warn-soft); color: var(--warn); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.kpi { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.kpi .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.kpi .val { font: 500 22px/1.25 var(--f-mono); font-variant-numeric: tabular-nums; }
.kpi .note { font-size: 12px; color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; }
.panel h2 { margin: 0 0 12px; font: 600 17px/1.3 var(--f-display); }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
svg text { fill: var(--muted); font: 11px var(--f-mono); }
.chart { width: 100%; height: auto; display: block; }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); }
nav.tabs button { appearance: none; border: 0; background: none; color: var(--muted); font: 500 14px var(--f-body); padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, button:focus-visible, .coin:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 500 11px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.reason { color: var(--muted); font-size: 13px; max-width: 46ch; }
.coin { font-weight: 600; cursor: pointer; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; font-weight: 600; }
.coin:hover { text-decoration-color: var(--accent); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 4px; font: 600 11px/1.7 var(--f-mono); letter-spacing: .04em; }
.p-BUY, .p-entry { background: var(--up-soft); color: var(--up); }
.p-SELL, .p-stop, .p-trail, .p-signal, .p-time, .p-breakeven { background: var(--down-soft); color: var(--down); }
.p-TRIM, .p-take_profit, .p-trim { background: var(--warn-soft); color: var(--warn); }
.p-HOLD, .p-SKIP { background: var(--sunk); color: var(--muted); }

.view { display: grid; gap: 18px; }
.lead { font-size: 16px; max-width: 70ch; margin: 0; text-wrap: pretty; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
ul.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
ul.plain li { min-width: 0; }
.src { font-size: 12px; color: var(--muted); }
.ev { padding: 8px 12px; background: var(--sunk); border-radius: 6px; font-size: 13.5px; }
details.run { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
details.run > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
details.run > summary::-webkit-details-marker { display: none; }
details.run[open] > summary { border-bottom: 1px solid var(--line); }
details.run .body { padding: 14px; display: grid; gap: 16px; }
.h3 { font: 600 13px var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0 0 8px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); padding: 0; width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog .dh { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
dialog .dh h3 { margin: 0; font: 700 20px var(--f-display); }
dialog .db { padding: 18px; display: grid; gap: 16px; overflow-y: auto; }
.x { appearance: none; border: 1px solid var(--line); background: var(--sunk); color: var(--fg); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 92px 1fr 44px; gap: 10px; align-items: center; font-size: 13px; }
.bar .track { height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
footer { color: var(--muted); font-size: 12px; text-align: center; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } .kpi .val { font-size: 19px; } }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .4s ease; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Field Notes</h1>
      <div class="sub" id="sub">Yükleniyor…</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <section class="kpis" id="kpis" aria-label="Özet"></section>

  <section class="panel">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
      <h2>Portföy ve BTC kıyası</h2>
      <div class="legend"><span><i style="background:var(--accent)"></i>Portföy</span><span><i style="background:var(--bench)"></i>BTC tut-bekle</span></div>
    </div>
    <div id="chart"></div>
  </section>

  <nav class="tabs" role="tablist" aria-label="Bölümler">
    <button role="tab" id="t-latest" aria-selected="true" data-v="latest">Son analiz</button>
    <button role="tab" id="t-pos" aria-selected="false" data-v="pos">Pozisyonlar</button>
    <button role="tab" id="t-trades" aria-selected="false" data-v="trades">İşlemler</button>
    <button role="tab" id="t-runs" aria-selected="false" data-v="runs">Geçmiş</button>
    <button role="tab" id="t-rules" aria-selected="false" data-v="rules">Kurallar</button>
  </nav>
  <main id="view" class="view"></main>
  <footer id="foot"></footer>
</div>

<dialog id="dlg" aria-labelledby="dlg-t">
  <div class="dh"><h3 id="dlg-t"></h3><button class="x" id="dlg-x">Kapat</button></div>
  <div class="db" id="dlg-b"></div>
</dialog>

<script>
"use strict";
const TZ = "Europe/Istanbul";
let D = null;
let tab = "latest";
try { tab = localStorage.getItem("fn-tab") || "latest"; } catch (e) {}
if (location.hash.length > 1) tab = location.hash.slice(1);

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const usd = (v, d = 2) => v == null ? "—" : v.toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " $";
const px = (v) => v == null ? "—" : v >= 100 ? v.toLocaleString("tr-TR", { maximumFractionDigits: 2 }) : v >= 1 ? v.toFixed(4) : Number(v.toPrecision(4)).toString();
const pct = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(d).replace(".", ",") + "%";
const cls = (v) => v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : "";
const when = (ts, opts) => new Date(ts).toLocaleString("tr-TR", Object.assign({ timeZone: TZ, day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }, opts || {}));
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : null;
const REG = { RISK_ON: ["on", "Risk açık"], NEUTRAL: ["neu", "Nötr"], RISK_OFF: ["off", "Risk kapalı"] };
const KIND = { entry: "ALIM", stop: "STOP", trail: "İZ STOP", breakeven: "BAŞA BAŞ", take_profit: "KÂR AL", time: "ZAMAN", signal: "SATIŞ", trim: "AZALT" };
const VERD = { BUY: "AL", SELL: "SAT", TRIM: "AZALT", HOLD: "TUT", SKIP: "GEÇ" };
const SLOT = { sabah: "Sabah", "akşam": "Akşam", gece: "Gece" };

function regimeChip(r) { const [c, t] = REG[r?.name] || ["", "—"]; return `<span class="chip ${c}">${t}</span>`; }

function spark(vals, w = 120, h = 32) {
  if (!vals || vals.length < 2) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals), r = hi - lo || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * (w - 4) + 2, h - 3 - (v - lo) / r * (h - 6)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join("");
  const col = vals[vals.length - 1] >= vals[0] ? "var(--up)" : "var(--down)";
  const last = pts[pts.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="${col}"/></svg>`;
}

function equityChart(series, capital) {
  if (!series.length) return `<div class="empty">İlk çalışmadan sonra grafik burada görünecek.</div>`;
  const W = 1000, H = 280, L = 64, R = 16, T = 14, B = 30;
  const pts = [{ ts: D.start_ts || series[0].ts, equity: capital, btc_bench: capital }, ...series];
  const vals = pts.flatMap((p) => [p.equity, p.btc_bench]);
  let lo = Math.min(...vals, capital), hi = Math.max(...vals, capital);
  const pad = Math.max((hi - lo) * 0.12, capital * 0.01); lo -= pad; hi += pad;
  const t0 = pts[0].ts, t1 = Math.max(D.end_ts || 0, pts[pts.length - 1].ts);
  const x = (t) => L + (t - t0) / ((t1 - t0) || 1) * (W - L - R);
  const y = (v) => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  g += `<line x1="${L}" x2="${W - R}" y1="${y(capital)}" y2="${y(capital)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>`;
  const days = Math.ceil((t1 - t0) / 864e5);
  const step = days > 8 ? 2 : 1;
  for (let d = 0; d <= days; d += step) {
    const t = t0 + d * 864e5; if (t > t1) break;
    g += `<text x="${x(t)}" y="${H - 8}" text-anchor="middle">${new Date(t).toLocaleDateString("tr-TR", { timeZone: TZ, day: "numeric", month: "short" })}</text>`;
  }
  const line = (k) => pts.map((p, i) => (i ? "L" : "M") + x(p.ts).toFixed(1) + " " + y(p[k]).toFixed(1)).join("");
  const area = line("equity") + `L${x(pts[pts.length - 1].ts).toFixed(1)} ${y(lo)}L${x(pts[0].ts).toFixed(1)} ${y(lo)}Z`;
  const lp = pts[pts.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Portföy değeri ve BTC kıyası">
    ${g}
    <path d="${area}" fill="var(--accent-soft)" opacity=".7"/>
    <path d="${line("btc_bench")}" fill="none" stroke="var(--bench)" stroke-width="2"/>
    <path d="${line("equity")}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
    <circle cx="${x(lp.ts)}" cy="${y(lp.btc_bench)}" r="4" fill="var(--bench)"/>
    <circle cx="${x(lp.ts)}" cy="${y(lp.equity)}" r="5" fill="var(--accent)"/>
  </svg>`;
}

function header() {
  const k = D.kpis;
  const day = D.start_ts ? Math.min(D.rules.days, Math.floor((Date.now() - D.start_ts) / 864e5) + 1) : 0;
  const st = D.status === "live" ? `<span class="chip live">Canlı · Gün ${day}/${D.rules.days}</span>`
    : D.status === "finished" ? `<span class="chip">Tamamlandı</span>` : `<span class="chip">Başlamadı</span>`;
  $("#chips").innerHTML = st + (D.latest ? regimeChip(D.latest.regime) : "");
  $("#sub").textContent = D.latest ? `Son çalışma ${when(D.latest.ts)} · ${k.runs} çalışma` : "İlk çalışma bekleniyor";
  const alpha = k.pnl_pct - k.btc_pct;
  const cells = [
    ["Portföy", usd(k.equity), `<span class="${cls(k.pnl_pct)}">${pct(k.pnl_pct, 2)}</span> · başlangıç ${usd(D.capital, 0)}`],
    ["BTC tut-bekle", `<span class="${cls(k.btc_pct)}">${pct(k.btc_pct, 2)}</span>`, "aynı sürede"],
    ["Fark", `<span class="${cls(alpha)}">${pct(alpha, 2)}</span>`, alpha >= 0 ? "BTC'nin önünde" : "BTC'nin gerisinde"],
    ["Nakit", usd(k.cash), `maruziyet %${Math.round(k.exposure_pct)}`],
    ["En büyük düşüş", `<span class="${k.max_dd_pct > 0 ? "down" : ""}">${k.max_dd_pct ? "−" + k.max_dd_pct.toFixed(1).replace(".", ",") + "%" : "0%"}</span>`, "zirveden"],
    ["İşlem", `${k.n_trades}`, k.win_rate == null ? "kapanan yok" : `kazanma %${Math.round(k.win_rate)} · ${usd(k.realized_usd)}`],
  ];
  $("#kpis").innerHTML = cells.map(([l, v, n]) => `<div class="kpi"><span class="lbl">${l}</span><span class="val">${v}</span><span class="note">${n}</span></div>`).join("");
  $("#chart").innerHTML = equityChart(D.equity, D.capital);
  $("#foot").textContent = `Sanal portföy deneyi. Gerçek para kullanılmıyor. Veri güncellendi: ${when(D.generated)}`;
}

function coinBtn(id, sym) { return `<button class="coin" data-coin="${esc(id)}">${esc((sym || id).toUpperCase())}</button>`; }

function reviewsTable(rv) {
  if (!rv?.length) return `<p class="muted">Bu çalışmada coin değerlendirmesi yok.</p>`;
  const order = { BUY: 0, SELL: 1, TRIM: 2, HOLD: 3, SKIP: 4 };
  rv = [...rv].sort((a, b) => (order[a.verdict] ?? 9) - (order[b.verdict] ?? 9) || (b.final_score ?? 0) - (a.final_score ?? 0));
  return `<div class="tablewrap"><table><thead><tr><th>Coin</th><th>Karar</th><th class="n">Teknik</th><th class="n">Haber</th><th class="n">Nihai</th><th>Gerekçe</th></tr></thead><tbody>${
    rv.map((r) => `<tr><td>${coinBtn(r.id, r.symbol)}${r.catalyst ? ' <span class="pill p-TRIM">KATALİZÖR</span>' : ""}</td>
      <td><span class="pill p-${esc(r.verdict)}">${VERD[r.verdict] || esc(r.verdict)}</span>${r.conviction === "half" ? ' <span class="src">yarım</span>' : ""}</td>
      <td class="n">${r.tech_score ?? "—"}</td><td class="n ${cls(r.news_adj)}">${r.news_adj ? (r.news_adj > 0 ? "+" : "") + r.news_adj : "0"}</td>
      <td class="n"><b>${r.final_score ?? "—"}</b></td><td class="reason">${esc(r.reason)}</td></tr>`).join("")
  }</tbody></table></div>`;
}

function newsList(items) {
  if (!items?.length) return `<p class="muted">Kayıt yok.</p>`;
  return `<ul class="plain">${items.map((n) => {
    const u = safeUrl(n.url);
    const s = n.sentiment === "+" ? "up" : n.sentiment === "-" ? "down" : "";
    const imp = n.impact ? ` · ${esc(n.impact)}` : "";
    return `<li><div>${n.coin ? coinBtn(n.coin, n.coin) + " · " : ""}<span class="${s}">${u ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a>` : esc(n.title)}</span></div>
      <div class="src">${esc(n.source || "")}${imp}${n.note ? " — " + esc(n.note) : ""}</div></li>`;
  }).join("")}</ul>`;
}

function actionsBlock(r) {
  const ex = r.executed || [], rj = r.rejected || [], evs = r.events || [], w = r.warnings || [];
  let h = "";
  if (evs.length) h += `<div><p class="h3">Otomatik olaylar</p><div style="display:grid;gap:6px">${evs.map((e) => `<div class="ev">${esc(e)}</div>`).join("")}</div></div>`;
  h += `<div><p class="h3">Uygulanan işlemler</p>${ex.length ? `<ul class="plain">${ex.map((x) => `<li><span class="pill p-${x.action}">${VERD[x.action]}</span> ${coinBtn(x.id, x.symbol)}
      ${x.usd ? `<span class="mono">${usd(x.usd)}</span> @ <span class="mono">${px(x.price)}</span> · stop %${String(x.stop_pct).replace(".", ",")} · skor ${x.final_score}` : ""}
      ${x.pnl_usd != null ? `<span class="mono ${cls(x.pnl_usd)}">${usd(x.pnl_usd)}</span>` : ""}
      ${x.notes?.length ? `<span class="src">(${esc(x.notes.join(", "))})</span>` : ""}
      <div class="reason">${esc(x.reason)}</div></li>`).join("")}</ul>` : `<p class="muted">İşlem yapılmadı.</p>`}</div>`;
  if (rj.length) h += `<div><p class="h3">Kurallara takılanlar</p><ul class="plain">${rj.map((x) => `<li>${coinBtn(x.id, x.symbol)} <span class="src">${esc(x.reason)}</span></li>`).join("")}</ul></div>`;
  if (w.length) h += `<div>${w.map((x) => `<div class="ev">${esc(x)}</div>`).join("")}</div>`;
  return h;
}

function runBody(r) {
  return `<p class="lead">${esc(r.market_view) || '<span class="muted">Yorum yok.</span>'}</p>
    ${r.macro_event_risk ? '<div class="ev" style="background:var(--warn-soft);color:var(--warn)">Yakın makro olay riski: yeni pozisyonlar yarım boyutla.</div>' : ""}
    <div class="grid2"><div>${actionsBlock(r)}</div>
      <div style="display:grid;gap:16px"><div><p class="h3">Makro</p>${newsList(r.macro_notes)}</div><div><p class="h3">İncelenen haberler</p>${newsList(r.news)}</div></div></div>
    <div><p class="h3">Coin değerlendirmeleri</p>${reviewsTable(r.reviews)}</div>`;
}

function viewLatest() {
  const r = D.runs[0], L = D.latest;
  if (!r && !L) return `<div class="panel empty">İlk analiz henüz yapılmadı. Çalışmalar her gün 09:00, 17:00 ve 01:00'de.</div>`;
  let ctx = "";
  if (L) {
    const fg = L.fear_greed?.[0];
    const st = L.stablecoins;
    const m = L.macro || {};
    const mac = Object.entries(m).filter(([, v]) => v && v.last != null).map(([k, v]) => `<span class="chip">${k.toUpperCase()} <span class="mono">${v.last.toFixed(2)}</span> <span class="${cls(v.chg_5d_pct)}">${pct(v.chg_5d_pct)}</span></span>`).join("");
    ctx = `<section class="panel"><h2>Piyasa ortamı</h2><div class="chips">
      ${regimeChip(L.regime)}
      <span class="chip">BTC <span class="mono">${px(L.btc.price)} $</span> <span class="${cls(L.btc.ret_24h)}">${pct(L.btc.ret_24h)}</span></span>
      <span class="chip">BTC 7g <span class="${cls(L.btc.ret_7d)}">${pct(L.btc.ret_7d)}</span></span>
      ${fg ? `<span class="chip">Korku/Açgözlülük <b class="mono">${fg.value}</b> ${esc(fg.label)}</span>` : ""}
      <span class="chip">Genişlik %${L.regime.breadth_pct}</span>
      ${L.global?.btc_dominance ? `<span class="chip">BTC dominans %${L.global.btc_dominance.toFixed(1)}</span>` : ""}
      ${st ? `<span class="chip">Stablecoin 7g <span class="${cls(st.chg_7d_pct)}">${pct(st.chg_7d_pct, 2)}</span></span>` : ""}
      ${mac}</div></section>`;
  }
  const run = r ? `<section class="panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:baseline"><h2>${SLOT[r.slot] || ""} analizi · ${when(r.ts)}</h2>${regimeChip(r.regime)}</div>${runBody(r)}</section>` : "";
  const cands = L?.candidates?.length ? `<section class="panel"><h2>Teknik adaylar</h2><div class="tablewrap"><table><thead><tr><th>Coin</th><th class="n">Skor</th><th class="n">24s</th><th class="n">7g</th><th class="n">RSI 4s</th><th class="n">Hacim</th><th>Son 7 gün</th></tr></thead><tbody>${
    L.candidates.map((c) => `<tr><td>${coinBtn(c.id, c.symbol)} <span class="src">#${c.rank}</span></td><td class="n"><b>${c.score}</b></td>
      <td class="n ${cls(c.ret_24h)}">${pct(c.ret_24h)}</td><td class="n ${cls(c.ret_7d)}">${pct(c.ret_7d)}</td>
      <td class="n">${c.rsi_4h == null ? "—" : Math.round(c.rsi_4h)}</td><td class="n">${c.vol_ratio == null ? "—" : c.vol_ratio.toFixed(1).replace(".", ",") + "×"}</td><td>${spark(c.spark)}</td></tr>`).join("")
  }</tbody></table></div></section>` : "";
  return ctx + run + cands;
}

function viewPositions() {
  const P = D.positions;
  if (!P.length) return `<div class="panel empty">Açık pozisyon yok. Portföy tamamen nakitte.</div>`;
  return `<section class="panel"><h2>Açık pozisyonlar</h2><div class="tablewrap"><table><thead><tr><th>Coin</th><th class="n">Değer</th><th class="n">K/Z</th><th class="n">Giriş</th><th class="n">Şimdi</th><th class="n">Stop</th><th class="n">Hedef</th><th>Son 7 gün</th><th>Neden alındı</th></tr></thead><tbody>${
    P.map((p) => `<tr><td>${coinBtn(p.id, p.symbol)}<div class="src">${p.tier === "large" ? "büyük" : "küçük/orta"} · ${when(p.entry_ts)}</div></td>
      <td class="n">${usd(p.value)}</td><td class="n ${cls(p.pnl_pct)}"><b>${pct(p.pnl_pct)}</b></td>
      <td class="n">${px(p.entry_price)}</td><td class="n">${px(p.last_price)}</td><td class="n">${px(p.stop)}</td>
      <td class="n">${p.tp_done ? '<span class="pill p-take_profit">ALINDI</span>' : px(p.tp_price)}</td><td>${spark(p.spark)}</td>
      <td class="reason">${esc(p.reason)}${p.note ? `<div><b>Son not:</b> ${esc(p.note)}</div>` : ""}</td></tr>`).join("")
  }</tbody></table></div></section>`;
}

function viewTrades() {
  const T = D.trades;
  if (!T.length) return `<div class="panel empty">Henüz işlem yok.</div>`;
  return `<section class="panel"><h2>İşlem defteri</h2><div class="tablewrap"><table><thead><tr><th>Zaman</th><th>Coin</th><th>Tür</th><th class="n">Fiyat</th><th class="n">Tutar</th><th class="n">K/Z</th><th>Not</th></tr></thead><tbody>${
    T.map((t) => `<tr><td class="mono" style="white-space:nowrap">${when(t.ts)}</td><td>${coinBtn(t.id, t.symbol)}</td>
      <td><span class="pill p-${t.kind}">${KIND[t.kind] || t.kind}</span></td><td class="n">${px(t.price)}</td><td class="n">${usd(t.usd)}</td>
      <td class="n ${cls(t.pnl_usd)}">${t.pnl_usd == null ? "" : usd(t.pnl_usd) + `<div class="src">${pct(t.pnl_pct)}</div>`}</td>
      <td class="reason">${esc(t.reason)}</td></tr>`).join("")
  }</tbody></table></div></section>`;
}

function viewRuns() {
  if (!D.runs.length) return `<div class="panel empty">Geçmiş çalışma yok.</div>`;
  return D.runs.map((r, i) => {
    const n = (r.executed || []).length;
    return `<details class="run"${i === 0 ? " open" : ""}><summary><span><b>${when(r.ts)}</b> <span class="muted">· ${SLOT[r.slot] || ""}</span></span>
      <span class="chips">${regimeChip(r.regime)}<span class="chip">${n ? n + " işlem" : "işlem yok"}</span><span class="chip mono">${usd(r.equity)}</span></span></summary>
      <div class="body">${runBody(r)}</div></details>`;
  }).join("");
}

function viewRules() {
  const R = D.rules, r = R.risk, e = R.entry;
  const row = (a, b) => `<tr><td>${a}</td><td>${b}</td></tr>`;
  return `<section class="panel"><h2>Sabit kurallar</h2><p class="muted" style="margin-top:0">Test başlamadan yazıldı, ${R.days} gün boyunca değişmez.</p><div class="tablewrap"><table><tbody>
    ${row("Sermaye", usd(R.capital, 0) + " sanal")}
    ${row("Çalışma saatleri", "09:00 · 17:00 · 01:00 (TSİ)")}
    ${row("Coin evreni", "İlk 300, günlük hacim ≥ 5 milyon $, stablecoin ve türev tokenlar hariç")}
    ${row("İşlem başına risk", "%" + r.risk_per_trade_pct + " · stop = 2×ATR (büyük %4–8, küçük %6–15)")}
    ${row("Pozisyon tavanı", "büyük %" + r.max_position_pct.large + " · küçük %" + r.max_position_pct.small + " · en çok " + r.max_positions + " pozisyon · en az %" + r.min_cash_pct + " nakit")}
    ${row("Rejime göre maruziyet", Object.entries(R.exposure).map(([k, v]) => (REG[k]?.[1] || k) + " %" + v).join(" · "))}
    ${row("Alım eşiği", "nihai skor ≥ " + e.min_final_score + " (risk kapalıyken küçük coinde ≥ " + e.risk_off_small_min_final + ")")}
    ${row("Haber puanı", e.news_adj_bounds[0] + " ile +" + e.news_adj_bounds[1] + " arası")}
    ${row("Kovalama yasağı", "24s > %" + e.max_ret_24h_pct + ", 7g > %" + e.max_ret_7d_pct + " veya EMA20'den %" + e.max_ext_ema20d_pct + " uzaksa alınmaz")}
    ${row("Kâr alma", "+" + r.take_profit_r + "R'de yarısı satılır, kalanı iz süren stopla")}
    ${row("Zaman stopu", r.time_stop_hours / 24 + " gün, %" + r.time_stop_min_gain_pct + " altı kazanç ve skor < " + r.time_stop_max_score)}
    ${row("Acil fren", "zirveden %" + r.dd_no_small_pct + " düşüşte küçük coin yok · %" + r.dd_no_entries_pct + " düşüşte alım yok")}
    ${row("Maliyetler", "komisyon %0,1 · kayma %0,05–0,4 · stoplarda 2 katı")}
  </tbody></table></div></section>`;
}

function coinDialog(id) {
  const pos = D.positions.find((p) => p.id === id);
  const cand = D.latest?.candidates?.find((c) => c.id === id);
  const hist = [];
  D.runs.forEach((r) => (r.reviews || []).forEach((v) => { if (v.id === id) hist.push({ ts: r.ts, ...v }); }));
  const news = []; D.runs.forEach((r) => (r.news || []).forEach((n) => { if (n.coin === id) news.push(n); }));
  const trades = D.trades.filter((t) => t.id === id);
  const sym = (pos?.symbol || cand?.symbol || hist[0]?.symbol || trades[0]?.symbol || id).toUpperCase();
  $("#dlg-t").textContent = sym + (cand?.name || pos?.name ? " · " + (cand?.name || pos?.name) : "");
  let h = "";
  const sp = pos?.spark?.length ? pos.spark : cand?.spark;
  if (sp?.length) h += `<div><p class="h3">Son 7 gün (4 saatlik)</p>${spark(sp, 560, 90).replace("<svg ", '<svg class="chart" ')}</div>`;
  if (pos) h += `<div class="chips"><span class="chip">Değer ${usd(pos.value)}</span><span class="chip ${pos.pnl_pct >= 0 ? "on" : "off"}">K/Z ${pct(pos.pnl_pct)}</span><span class="chip">Stop ${px(pos.stop)}</span></div>`;
  if (cand?.parts) {
    const max = { trend: 25, momentum: 20, volume: 20, structure: 15, derivatives: 10, volatility: 10 };
    const tr = { trend: "Trend", momentum: "Momentum", volume: "Hacim", structure: "Yapı", derivatives: "Türev", volatility: "Volatilite" };
    h += `<div><p class="h3">Teknik skor ${cand.score}/100</p><div class="bars">${Object.entries(cand.parts).map(([k, v]) =>
      `<div class="bar"><span>${tr[k] || k}</span><span class="track"><span class="fill" style="display:block;width:${Math.round(v / max[k] * 100)}%"></span></span><span class="mono">${v}/${max[k]}</span></div>`).join("")}</div></div>`;
    if (cand.deriv) h += `<div class="chips"><span class="chip">Funding (8s) <span class="mono">${cand.deriv.funding_8h_pct.toFixed(3)}%</span></span><span class="chip">OI <span class="mono">${usd(cand.deriv.oi_usd / 1e6, 1).replace(" $", " mn $")}</span></span>${cand.deriv.oi_chg_24h_pct != null ? `<span class="chip">OI 24s <span class="${cls(cand.deriv.oi_chg_24h_pct)}">${pct(cand.deriv.oi_chg_24h_pct)}</span></span>` : ""}</div>`;
  }
  if (hist.length) h += `<div><p class="h3">Kararlar</p><ul class="plain">${hist.slice(0, 8).map((v) => `<li><span class="pill p-${v.verdict}">${VERD[v.verdict] || v.verdict}</span> <span class="src">${when(v.ts)} · nihai ${v.final_score ?? "—"}</span><div class="reason">${esc(v.reason)}</div></li>`).join("")}</ul></div>`;
  if (news.length) h += `<div><p class="h3">İlgili haberler</p>${newsList(news.slice(0, 8))}</div>`;
  else if (cand?.headlines?.length) h += `<div><p class="h3">RSS başlıkları</p>${newsList(cand.headlines.map((x) => ({ title: x.title, url: x.url, source: x.source })))}</div>`;
  if (trades.length) h += `<div><p class="h3">İşlemler</p><ul class="plain">${trades.map((t) => `<li><span class="pill p-${t.kind}">${KIND[t.kind] || t.kind}</span> <span class="mono">${px(t.price)}</span> · ${usd(t.usd)} <span class="src">${when(t.ts)}</span></li>`).join("")}</ul></div>`;
  $("#dlg-b").innerHTML = h || `<p class="muted">Bu coin için kayıt yok.</p>`;
  $("#dlg").showModal();
}

function render() {
  document.querySelectorAll("nav.tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.v === tab)));
  const V = { latest: viewLatest, pos: viewPositions, trades: viewTrades, runs: viewRuns, rules: viewRules };
  $("#view").innerHTML = (V[tab] || viewLatest)();
}

document.querySelector("nav.tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.v; try { localStorage.setItem("fn-tab", tab); } catch (err) {}
  history.replaceState(null, "", "#" + tab); render();
});
document.addEventListener("click", (e) => { const c = e.target.closest("[data-coin]"); if (c) coinDialog(c.dataset.coin); });
$("#dlg-x").addEventListener("click", () => $("#dlg").close());
$("#dlg").addEventListener("click", (e) => { if (e.target.id === "dlg") $("#dlg").close(); });

async function load() {
  try {
    const r = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    D = await r.json();
    header(); render();
  } catch (e) {
    $("#sub").textContent = "Veri yüklenemedi (" + e.message + "). Sayfayı yenileyin.";
  }
}
load();
setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
